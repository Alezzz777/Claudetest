services:
  mobile-voting:
    build: .
    container_name: mobile-voting
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://admin:ctJcRTxH028pc4Svh4ti@postgres:5432/voting
      - DATA_FILE=/app/data/data.json
    expose:
      - "3000"
    networks:
      - build_default
    volumes:
      - ../data:/app/data

networks:
  build_default:
    external: true
