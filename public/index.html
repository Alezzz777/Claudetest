<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d6efd">
    <title>Цех — учёт изделий</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
    <main class="login-card">
        <h1>Учёт изделий</h1>
        <p class="muted">Штучный контроль на участках цеха</p>

        <form id="login-form" autocomplete="on">
            <label>Логин
                <input type="text" name="username" required autocomplete="username" inputmode="text">
            </label>
            <label>Пароль
                <input type="password" name="password" required autocomplete="current-password">
            </label>
            <button type="submit" class="btn primary big">Войти</button>
            <div id="login-error" class="error-banner hidden"></div>
        </form>

        <details class="hint">
            <summary>Тестовые учётные записи</summary>
            <ul>
                <li><b>worker</b> / worker123 — рабочий</li>
                <li><b>foreman</b> / foreman123 — бригадир</li>
                <li><b>master</b> / master123 — мастер</li>
                <li><b>tech</b> / tech123 — технолог</li>
                <li><b>admin</b> / admin123 — администратор</li>
            </ul>
            <p style="margin-top:.75rem;font-size:.85rem">
                <a href="/health.html">Состояние системы →</a>
            </p>
        </details>
    </main>

    <script src="/js/login.js"></script>
</body>
</html>
