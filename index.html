<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e88e5">
<title>Контроль голосования</title>
<link rel="manifest" href="manifest.json">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#f4f6f8; color:#1f2933;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  body { min-height:100vh; display:flex; flex-direction:column; }

  header {
    position:sticky; top:0; z-index:10;
    background:#1e88e5; color:#fff; padding:10px 14px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 2px 6px rgba(0,0,0,.15); gap:8px;
  }
  header .title { display:flex; align-items:center; gap:8px; min-width:0; }
  header h1 { margin:0; font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .who { font-size:11px; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .badge { background:#ff9800; color:#fff; font-size:10px; padding:1px 5px; border-radius:4px; margin-left:4px; }
  header .actions { display:flex; gap:6px; flex-shrink:0; }
  header button, header a.btnlink {
    background: rgba(255,255,255,.18); color:#fff; border:none;
    padding:8px 10px; border-radius:8px; font-size:14px;
    text-decoration:none; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
  }
  header button:active, header a.btnlink:active { background: rgba(255,255,255,.32); }
  .conn { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ffca28; }
  .conn.ok { background:#66bb6a; } .conn.bad { background:#ef5350; }

  .breadcrumbs {
    background:#fff; padding:8px 14px; box-shadow:0 1px 2px rgba(0,0,0,.04);
    display:flex; flex-wrap:wrap; align-items:center; gap:4px;
    font-size:13px; position:sticky; top:54px; z-index:9;
  }
  .breadcrumbs a, .breadcrumbs span.bc {
    color:#1e88e5; text-decoration:none; cursor:pointer;
    padding:4px 8px; border-radius:6px;
  }
  .breadcrumbs a:active { background:#e3f2fd; }
  .breadcrumbs .sep { color:#b0bec5; }
  .breadcrumbs .current { color:#37474f; font-weight:600; padding:4px 8px; }
  .breadcrumbs .type-tag {
    font-size:10px; background:#eceff1; color:#546e7a;
    padding:1px 5px; border-radius:4px; margin-left:4px;
    text-transform:uppercase; letter-spacing:.3px;
  }

  main { flex:1; padding:12px 14px 100px; }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:#fff; border-radius:10px; padding:10px 8px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .stat .val { font-size:22px; font-weight:700; color:#1e88e5; }
  .stat .lbl { font-size:11px; color:#607080; margin-top:2px; text-transform:uppercase; letter-spacing:.3px; }

  .progress-wrap { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .progress-head { display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px; }
  .progress-head b { color:#1e88e5; font-size:16px; }
  .progress-bar { height:10px; background:#e3eaf0; border-radius:6px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,#43a047,#66bb6a); width:0%; transition:width .25s ease; border-radius:6px; }
  .progress-fill.low { background:linear-gradient(90deg,#ef5350,#ef9a9a); }
  .progress-fill.mid { background:linear-gradient(90deg,#ffa726,#ffcc80); }

  .search-box { margin-bottom:10px; }
  .search-box input {
    width:100%; padding:12px 14px; border:1px solid #d0d8e0;
    border-radius:10px; font-size:16px; background:#fff; outline:none;
  }
  .search-box input:focus { border-color:#1e88e5; }

  .filter-tabs { display:flex; gap:6px; margin-bottom:10px; }
  .filter-tabs button {
    flex:1; background:#fff; border:1px solid #d0d8e0;
    padding:9px 6px; border-radius:8px; font-size:13px; color:#455a64; cursor:pointer;
  }
  .filter-tabs button.active { background:#1e88e5; color:#fff; border-color:#1e88e5; }

  .voter-list, .child-list { list-style:none; padding:0; margin:0; }
  .voter {
    background:#fff; margin-bottom:6px; border-radius:10px;
    padding:14px; display:flex; align-items:center; gap:12px;
    box-shadow:0 1px 2px rgba(0,0,0,.05); cursor:pointer; user-select:none;
    transition:background .15s;
  }
  .voter:active { background:#eef4fb; }
  .voter.voted { background:#e8f5e9; }
  .voter.voted .name { text-decoration:line-through; color:#6b7c80; }
  .voter .check {
    width:26px; height:26px; border-radius:50%; border:2px solid #b0bec5;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; background:#fff; font-size:16px; color:transparent;
  }
  .voter.voted .check { background:#43a047; border-color:#43a047; color:#fff; }
  .voter .name { flex:1; font-size:15px; line-height:1.3; }
  .voter .meta { font-size:11px; color:#78909c; text-align:right; line-height:1.3; }
  .voter .meta .by { display:block; color:#90a4ae; }

  .child {
    background:#fff; margin-bottom:8px; border-radius:12px;
    padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.06);
    cursor:pointer; user-select:none; transition:background .15s;
  }
  .child:active { background:#eef4fb; }
  .child-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .child-icon {
    width:36px; height:36px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; flex-shrink:0;
  }
  .child-icon.factory { background:#e8eaf6; color:#3f51b5; }
  .child-icon.workshop { background:#fff3e0; color:#f57c00; }
  .child-icon.precinct { background:#e3f2fd; color:#1976d2; }
  .child-info { flex:1; min-width:0; }
  .child-name { font-weight:600; font-size:15px; }
  .child-sub { font-size:12px; color:#78909c; margin-top:1px; }
  .child-pct { font-size:18px; font-weight:700; color:#1e88e5; }
  .child-bar { height:6px; background:#e3eaf0; border-radius:3px; overflow:hidden; margin-top:4px; }
  .child-bar-fill { height:100%; background:linear-gradient(90deg,#43a047,#66bb6a); transition:width .25s ease; }
  .child-bar-fill.low { background:linear-gradient(90deg,#ef5350,#ef9a9a); }
  .child-bar-fill.mid { background:linear-gradient(90deg,#ffa726,#ffcc80); }

  .empty { text-align:center; padding:40px 20px; color:#78909c; font-size:14px; }
  .empty h3 { margin: 8px 0; }

  .modal-bg {
    position:fixed; inset:0; background:rgba(0,0,0,.5);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-bg.show { display:flex; }
  .modal {
    background:#fff; width:100%; max-width:600px;
    border-radius:16px 16px 0 0; padding:18px;
    max-height:88vh; overflow-y:auto; animation:slideUp .2s ease;
  }
  @keyframes slideUp { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  .modal h2 { margin:0 0 14px; font-size:18px; }
  .modal label { display:block; font-size:13px; color:#546e7a; margin:10px 0 5px; }
  .modal input, .modal textarea, .modal select {
    width:100%; padding:11px 12px; border:1px solid #d0d8e0;
    border-radius:10px; font-size:15px; font-family:inherit; outline:none; background:#fff;
  }
  .modal textarea { min-height:160px; resize:vertical; }
  .modal-actions { display:flex; gap:8px; margin-top:16px; }
  .btn { flex:1; padding:13px; border-radius:10px; border:none; font-size:15px; font-weight:600; cursor:pointer; }
  .btn-primary { background:#1e88e5; color:#fff; }
  .btn-secondary { background:#eceff1; color:#37474f; }
  .btn-danger { background:#e53935; color:#fff; }
  .btn:active { opacity:.85; }
  .hint { font-size:12px; color:#78909c; margin-top:4px; }

  .fab-create {
    position: fixed; right: 18px; bottom: 18px; z-index: 50;
  }
  .fab-create > button {
    width: 56px; height: 56px; border-radius: 50%;
    background:#1e88e5; color:#fff; border:none;
    font-size:28px; box-shadow:0 4px 12px rgba(30,136,229,.4); cursor:pointer;
  }
  .fab-create > button:active { transform: scale(.95); }
  .fab-menu {
    position:absolute; right:0; bottom:64px;
    background:#fff; border-radius:12px; padding:6px;
    box-shadow:0 6px 24px rgba(0,0,0,.16); display:none; min-width:180px;
  }
  .fab-menu.show { display:block; }
  .fab-menu button {
    display:flex; align-items:center; gap:10px; width:100%;
    background:none; border:none; padding:10px 12px;
    font-size:14px; color:#37474f; cursor:pointer; border-radius:8px;
    text-align:left;
  }
  .fab-menu button:hover, .fab-menu button:active { background:#f4f6f8; }
  .fab-menu .ico {
    width:28px; height:28px; border-radius:6px;
    display:inline-flex; align-items:center; justify-content:center; font-size:14px;
  }

  .toast {
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:rgba(33,33,33,.92); color:#fff; padding:10px 16px;
    border-radius:24px; font-size:14px; z-index:200;
    opacity:0; transition:opacity .25s; pointer-events:none; max-width:90%;
  }
  .toast.show { opacity:1; }

  .login-card {
    background:#fff; border-radius:14px; padding:24px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    max-width:460px; margin:40px auto;
  }
  .login-card h2 { margin:0 0 8px; }
  .login-card p { color:#607080; line-height:1.5; }

  .node-actions-bar {
    display:flex; gap:6px; margin-bottom:10px; flex-wrap: wrap;
  }
  .node-actions-bar button {
    background:#fff; border:1px solid #d0d8e0;
    padding:7px 11px; border-radius:8px; font-size:12px;
    color:#455a64; cursor:pointer;
  }
  .node-actions-bar button.danger { color:#c62828; border-color:#ffcdd2; }

  .owner-tag {
    font-size:11px; color:#1e88e5; background:#e3f2fd;
    padding:2px 7px; border-radius:10px; display:inline-block;
  }
</style>
</head>
<body>

<header>
  <div class="title">
    <span class="conn" id="conn"></span>
    <div style="min-width:0">
      <h1>Контроль голосования</h1>
      <div class="who" id="whoami"></div>
    </div>
  </div>
  <div class="actions" id="headerActions"></div>
</header>

<div class="breadcrumbs" id="breadcrumbs" style="display:none;"></div>

<main id="main"></main>

<div class="fab-create" id="fabCreate" style="display:none;">
  <div class="fab-menu" id="fabMenu"></div>
  <button id="fabBtn">+</button>
</div>

<div class="toast" id="toast"></div>

<!-- Create / Edit modal -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <h2 id="editTitle">Редактирование</h2>

    <label>Название</label>
    <input type="text" id="editName">

    <div id="ownerRow" style="display:none">
      <label>Владелец</label>
      <select id="editOwner"></select>
      <div class="hint">Доступно администратору. Владелец видит этот узел и все вложенные.</div>
    </div>

    <div id="parentRow" style="display:none">
      <label>Родитель</label>
      <select id="editParent"></select>
      <div class="hint">Доступно администратору. Можно перенести узел в другую ветку.</div>
    </div>

    <div id="votersRow" style="display:none">
      <label>Список сотрудников (по одному ФИО на строку)</label>
      <textarea id="editVoters" placeholder="Иванов Иван Иванович&#10;Петров Пётр Петрович"></textarea>
      <div style="display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap;">
        <label class="btn" style="background:#e3f2fd; color:#1565c0; flex:0 0 auto; padding:8px 12px; font-size:13px; cursor:pointer; font-weight:500;">
          📂 Импорт CSV
          <input type="file" id="votersCsvFile" accept=".csv,.txt,text/csv,text/plain" style="display:none;">
        </label>
        <label style="font-size:12px; color:#546e7a; display:flex; align-items:center; gap:6px;">
          <input type="checkbox" id="votersCsvAppend"> добавить к существующим
        </label>
        <span id="votersCsvStatus" style="font-size:12px; color:#43a047;"></span>
      </div>
      <div class="hint">Отметки голосования при изменении списка сохраняются по совпадению ФИО.</div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelEdit">Отмена</button>
      <button class="btn btn-primary" id="saveEdit">Сохранить</button>
    </div>
  </div>
</div>

<!-- Menu modal -->
<div class="modal-bg" id="menuModal">
  <div class="modal">
    <h2>Действия</h2>
    <div style="display:flex; flex-direction:column; gap:8px;" id="menuItems"></div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  function readUrlToken() {
    const params = new URLSearchParams(location.search);
    const t = params.get('token');
    if (t) {
      localStorage.setItem('vt_token', t);
      params.delete('token');
      const q = params.toString();
      history.replaceState({}, '', location.pathname + (q ? '?' + q : ''));
    }
  }
  readUrlToken();
  const tokenStr = () => localStorage.getItem('vt_token') || '';

  const TYPE_LABEL = { factory: 'завод', workshop: 'цех', precinct: 'участок' };
  const TYPE_ICON  = { factory: '🏭', workshop: '🛠️', precinct: '📋' };
  const CHILD_TYPE = { factory: 'workshop', workshop: 'precinct', precinct: null };

  const ui = {
    currentId: localStorage.getItem('vt_currentId') || null,
    filter: 'all',
    search: ''
  };

  let me = null;
  let serverNodes = [];
  let allUsers = [];
  let es = null;

  function setConn(s) {
    const el = $('conn');
    el.classList.remove('ok','bad');
    if (s === 'ok')  el.classList.add('ok');
    if (s === 'bad') el.classList.add('bad');
  }
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function formatTime(ts) {
    return new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }
  function fillCls(p) { return p < 33 ? 'low' : p < 66 ? 'mid' : ''; }

  async function api(method, path, body) {
    const opts = {
      method,
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + tokenStr() }
    };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const r = await fetch(path, opts);
    if (r.status === 401) { showLogin(); throw new Error('Не авторизованы'); }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    return data;
  }

  function showLogin() {
    me = null;
    $('headerActions').innerHTML = '';
    $('whoami').textContent = '';
    $('breadcrumbs').style.display = 'none';
    $('fabCreate').style.display = 'none';
    $('main').innerHTML = `
      <div class="login-card">
        <h2>Вход не выполнен</h2>
        <p>Откройте персональную ссылку, выданную администратором:</p>
        <code style="display:block; background:#f4f6f8; padding:10px; border-radius:8px; word-break:break-all; margin:10px 0; font-size:12px;">${escapeHtml(location.origin)}/?token=ВАШ_ТОКЕН</code>
        <label style="display:block; font-size:13px; color:#546e7a; margin-top:14px;">Или введите токен вручную:</label>
        <div style="display:flex; gap:8px; margin-top:6px;">
          <input id="manualToken" type="text" style="flex:1; padding:11px 12px; border:1px solid #d0d8e0; border-radius:10px; font-size:14px;" placeholder="токен">
          <button class="btn btn-primary" style="flex:0 0 auto; padding:11px 18px;" id="manualLogin">Войти</button>
        </div>
      </div>`;
    $('manualLogin').addEventListener('click', () => {
      const t = $('manualToken').value.trim();
      if (!t) return;
      localStorage.setItem('vt_token', t);
      init();
    });
  }

  function renderHeaderActions() {
    const a = $('headerActions');
    if (!me) { a.innerHTML = ''; return; }
    a.innerHTML = `
      ${me.isAdmin ? `<a class="btnlink" href="admin.html" title="Пользователи">👥</a>` : ''}
      ${me.isAdmin ? `<a class="btnlink" href="summary.html" title="Сводка">📊</a>` : ''}
      <button id="btnMenu" title="Меню">⋮</button>
    `;
    $('btnMenu').addEventListener('click', openMenu);
  }

  function findNode(id) { return serverNodes.find(n => n.id === id); }
  function rootNodes() {
    if (me && me.isAdmin) return serverNodes.filter(n => !n.parentId);
    // Regular user: roots are owned nodes whose parent is NOT visible/owned
    const visibleIds = new Set(serverNodes.map(n => n.id));
    return serverNodes.filter(n => {
      if (n.parentId && visibleIds.has(n.parentId)) {
        const parent = findNode(n.parentId);
        if (parent && (parent.ownerId === me.id || isOwnedAncestor(parent))) return false;
      }
      return n.ownerId === me.id || ownsDescendant(n);
    });
  }
  function isOwnedAncestor(node) {
    let cur = node;
    while (cur) {
      if (cur.ownerId === me.id) return true;
      cur = cur.parentId ? findNode(cur.parentId) : null;
    }
    return false;
  }
  function ownsDescendant(node) {
    // any descendant in serverNodes owned by me
    const stack = [node.id];
    while (stack.length) {
      const id = stack.pop();
      for (const c of serverNodes.filter(n => n.parentId === id)) {
        if (c.ownerId === me.id) return true;
        stack.push(c.id);
      }
    }
    return false;
  }

  function childrenOf(id) {
    return serverNodes.filter(n => n.parentId === id);
  }

  function currentNode() {
    return ui.currentId ? findNode(ui.currentId) : null;
  }

  function navTo(id) {
    ui.currentId = id;
    if (id) localStorage.setItem('vt_currentId', id); else localStorage.removeItem('vt_currentId');
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function render() {
    if (!me) return;
    $('whoami').innerHTML = escapeHtml(me.name) + (me.isAdmin ? '<span class="badge">админ</span>' : '');
    renderBreadcrumbs();
    renderFab();

    const main = $('main');
    if (serverNodes.length === 0) {
      main.innerHTML = `
        <div class="empty">
          <p style="font-size:48px; margin:0;">🏭</p>
          <h3>${me.isAdmin ? 'Структура пуста' : 'У вас пока нет назначенных узлов'}</h3>
          <p>${me.isAdmin
            ? 'Создайте завод, цех или участок. Структура: завод → цех → участок.'
            : 'Создайте свой участок или попросите администратора назначить вам узел.'}</p>
          ${me.isAdmin || true ? '<button class="btn btn-primary" style="max-width:240px; margin: 12px auto;" id="firstCreate">Создать</button>' : ''}
        </div>`;
      if ($('firstCreate')) $('firstCreate').addEventListener('click', () => openCreateMenu());
      return;
    }

    const cur = currentNode();
    if (cur && cur.type === 'precinct') return renderPrecinct(cur);
    renderBranch(cur);
  }

  function renderBreadcrumbs() {
    const bc = $('breadcrumbs');
    const cur = currentNode();
    const path = cur ? cur.path : [];
    if (!cur && rootNodes().length === 0) { bc.style.display = 'none'; return; }
    bc.style.display = 'flex';
    let html = `<a data-nav="">🏠 Главная</a>`;
    path.forEach((p, idx) => {
      const isLast = idx === path.length - 1;
      html += `<span class="sep">›</span>`;
      if (isLast) {
        html += `<span class="current">${escapeHtml(p.name)}<span class="type-tag">${TYPE_LABEL[p.type]||p.type}</span></span>`;
      } else {
        html += `<a data-nav="${p.id}">${escapeHtml(p.name)}</a>`;
      }
    });
    bc.innerHTML = html;
    bc.querySelectorAll('[data-nav]').forEach(el => {
      el.addEventListener('click', () => navTo(el.dataset.nav || null));
    });
  }

  function renderFab() {
    const cur = currentNode();
    const fab = $('fabCreate');
    const types = allowedChildTypes(cur);
    if (types.length === 0) { fab.style.display = 'none'; return; }
    fab.style.display = '';
    const menu = $('fabMenu');
    menu.innerHTML = types.map(t => `
      <button data-type="${t}">
        <span class="ico" style="background:${t==='factory'?'#e8eaf6':t==='workshop'?'#fff3e0':'#e3f2fd'}; color:${t==='factory'?'#3f51b5':t==='workshop'?'#f57c00':'#1976d2'}">${TYPE_ICON[t]}</span>
        Создать ${TYPE_LABEL[t]}
      </button>
    `).join('');
    menu.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => {
      $('fabMenu').classList.remove('show');
      openCreate(b.dataset.type, cur ? cur.id : null);
    }));
    $('fabBtn').onclick = () => $('fabMenu').classList.toggle('show');
  }

  function allowedChildTypes(parent) {
    if (!parent) {
      return me && me.isAdmin
        ? ['factory', 'workshop', 'precinct']
        : ['precinct'];
    }
    if (parent.type === 'factory')  return ['workshop', 'precinct'];
    if (parent.type === 'workshop') return ['precinct'];
    return [];
  }

  function renderBranch(parent) {
    // parent === null → root view
    const items = parent ? childrenOf(parent.id) : rootNodes();
    const main = $('main');

    const stats = parent ? parent.stats : aggregateStats(items);

    const headBlock = `
      <div class="stats">
        <div class="stat"><div class="val">${stats.total}</div><div class="lbl">Всего</div></div>
        <div class="stat"><div class="val" style="color:#43a047">${stats.voted}</div><div class="lbl">Голосовали</div></div>
        <div class="stat"><div class="val" style="color:#e53935">${stats.left}</div><div class="lbl">Осталось</div></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-head">
          <span>${parent ? TYPE_LABEL[parent.type].charAt(0).toUpperCase()+TYPE_LABEL[parent.type].slice(1)+': явка' : 'Общая явка'}</span>
          <b>${stats.pct.toFixed(1)}%</b>
        </div>
        <div class="progress-bar"><div class="progress-fill ${fillCls(stats.pct)}" style="width:${stats.pct}%"></div></div>
      </div>
    `;

    let actionBar = '';
    if (parent) {
      const canEdit = me.isAdmin || isOwnedAncestor(parent);
      if (canEdit) {
        actionBar = `
          <div class="node-actions-bar">
            ${me.isAdmin && parent.ownerName ? `<span class="owner-tag" style="padding:7px 11px;">Владелец: ${escapeHtml(parent.ownerName)}</span>` : ''}
            <button id="btnRename">✏️ Переименовать</button>
            <button id="btnResetSub">↺ Сбросить все отметки</button>
            <button class="danger" id="btnDeleteNode">🗑 Удалить</button>
          </div>`;
      }
    }

    if (items.length === 0) {
      const ct = allowedChildTypes(parent);
      main.innerHTML = `
        ${actionBar}
        ${headBlock}
        <div class="empty">
          <p style="font-size:48px; margin:0;">${parent ? TYPE_ICON[parent.type] : '🏭'}</p>
          <p>Здесь пока пусто.</p>
          ${ct.length ? `<button class="btn btn-primary" style="max-width:240px; margin:12px auto;" id="emptyCreate">Создать ${TYPE_LABEL[ct[0]]}</button>` : ''}
        </div>
      `;
      if ($('emptyCreate')) $('emptyCreate').addEventListener('click', () => openCreate(allowedChildTypes(parent)[0], parent ? parent.id : null));
    } else {
      items.sort((a, b) => {
        // order: factory → workshop → precinct, then alphabetic
        const lvl = { factory: 0, workshop: 1, precinct: 2 };
        if (lvl[a.type] !== lvl[b.type]) return lvl[a.type] - lvl[b.type];
        return a.name.localeCompare(b.name, 'ru');
      });
      main.innerHTML = `
        ${actionBar}
        ${headBlock}
        <ul class="child-list">
          ${items.map(n => {
            const s = n.stats;
            return `
              <li class="child" data-id="${n.id}">
                <div class="child-head">
                  <div class="child-icon ${n.type}">${TYPE_ICON[n.type]}</div>
                  <div class="child-info">
                    <div class="child-name">${escapeHtml(n.name)}</div>
                    <div class="child-sub">
                      ${TYPE_LABEL[n.type]}
                      ${n.type !== 'precinct' ? ` · вложено: ${n.childrenCount}` : ''}
                      · ${s.voted}/${s.total}
                      ${me.isAdmin && n.ownerName ? ` · ${escapeHtml(n.ownerName)}` : ''}
                    </div>
                  </div>
                  <div class="child-pct">${s.total ? s.pct.toFixed(0)+'%' : '—'}</div>
                </div>
                ${s.total ? `<div class="child-bar"><div class="child-bar-fill ${fillCls(s.pct)}" style="width:${s.pct}%"></div></div>` : ''}
              </li>
            `;
          }).join('')}
        </ul>
      `;
      main.querySelectorAll('.child').forEach(el => {
        el.addEventListener('click', () => navTo(el.dataset.id));
      });
    }

    if ($('btnRename')) $('btnRename').addEventListener('click', () => openEdit(parent));
    if ($('btnResetSub')) $('btnResetSub').addEventListener('click', () => resetSubtree(parent));
    if ($('btnDeleteNode')) $('btnDeleteNode').addEventListener('click', () => deleteNode(parent));
  }

  function aggregateStats(list) {
    let total = 0, voted = 0;
    for (const n of list) {
      // each n carries rollup stats
      total += n.stats.total;
      voted += n.stats.voted;
    }
    return { total, voted, left: total - voted, pct: total ? voted/total*100 : 0 };
  }

  function renderPrecinct(p) {
    const total = p.voters.length;
    const voted = p.voters.filter(v => v.voted).length;
    const left = total - voted;
    const pct = total ? voted/total*100 : 0;

    const filtered = p.voters
      .filter(v => ui.filter === 'all' || (ui.filter === 'voted' && v.voted) || (ui.filter === 'left' && !v.voted))
      .filter(v => !ui.search || v.name.toLowerCase().includes(ui.search.toLowerCase()))
      .slice()
      .sort((a, b) => {
        if (a.voted !== b.voted) return a.voted ? 1 : -1;
        return a.name.localeCompare(b.name, 'ru');
      });

    const canEdit = me.isAdmin || isOwnedAncestor(p);
    const main = $('main');
    main.innerHTML = `
      <div class="node-actions-bar">
        ${me.isAdmin && p.ownerName ? `<span class="owner-tag" style="padding:7px 11px;">Владелец: ${escapeHtml(p.ownerName)}</span>` : ''}
        ${canEdit ? `<button id="btnEditPr">✏️ Редактировать</button>` : ''}
        ${canEdit ? `<button id="btnResetPr">↺ Сбросить отметки</button>` : ''}
        ${canEdit ? `<button class="danger" id="btnDelPr">🗑 Удалить участок</button>` : ''}
      </div>
      <div class="stats">
        <div class="stat"><div class="val">${total}</div><div class="lbl">Всего</div></div>
        <div class="stat"><div class="val" style="color:#43a047">${voted}</div><div class="lbl">Голосовали</div></div>
        <div class="stat"><div class="val" style="color:#e53935">${left}</div><div class="lbl">Осталось</div></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-head"><span>Явка участка</span><b>${pct.toFixed(1)}%</b></div>
        <div class="progress-bar"><div class="progress-fill ${fillCls(pct)}" style="width:${pct}%"></div></div>
      </div>

      <div class="search-box">
        <input type="search" id="searchInput" placeholder="🔍 Поиск по ФИО..." value="${escapeHtml(ui.search)}">
      </div>
      <div class="filter-tabs">
        <button data-f="all"   class="${ui.filter==='all'?'active':''}">Все (${total})</button>
        <button data-f="left"  class="${ui.filter==='left'?'active':''}">Осталось (${left})</button>
        <button data-f="voted" class="${ui.filter==='voted'?'active':''}">Голосовали (${voted})</button>
      </div>

      ${total === 0 ? `
        <div class="empty">
          <p>В этом участке нет сотрудников.</p>
          ${canEdit ? `<button class="btn btn-primary" style="max-width:240px; margin: 8px auto;" id="addVotersBtn">Добавить список</button>` : ''}
        </div>
      ` : filtered.length === 0 ? `
        <div class="empty"><p>Ничего не найдено.</p></div>
      ` : `
        <ul class="voter-list">
          ${filtered.map(v => `
            <li class="voter ${v.voted ? 'voted' : ''}" data-id="${v.id}">
              <div class="check">${v.voted ? '✓' : ''}</div>
              <div class="name">${escapeHtml(v.name)}</div>
              ${v.voted && v.ts ? `<div class="meta">${formatTime(v.ts)}${v.by ? `<span class="by">${escapeHtml(v.by)}</span>`:''}</div>` : ''}
            </li>
          `).join('')}
        </ul>
      `}
    `;

    const si = $('searchInput');
    if (si) si.addEventListener('input', e => { ui.search = e.target.value; renderListOnly(); });
    main.querySelectorAll('.filter-tabs button').forEach(b => {
      b.addEventListener('click', () => { ui.filter = b.dataset.f; render(); });
    });
    if (canEdit) {
      main.querySelectorAll('.voter').forEach(el => el.addEventListener('click', () => toggleVote(el.dataset.id)));
    } else {
      main.querySelectorAll('.voter').forEach(el => el.style.cursor = 'default');
    }
    if ($('btnEditPr')) $('btnEditPr').addEventListener('click', () => openEdit(p));
    if ($('btnResetPr')) $('btnResetPr').addEventListener('click', () => resetSubtree(p));
    if ($('btnDelPr'))   $('btnDelPr').addEventListener('click', () => deleteNode(p));
    if ($('addVotersBtn')) $('addVotersBtn').addEventListener('click', () => openEdit(p));
  }

  function renderListOnly() {
    const active = document.activeElement;
    const selStart = active && active.id === 'searchInput' ? active.selectionStart : null;
    render();
    if (selStart !== null) {
      const s = $('searchInput');
      if (s) { s.focus(); try { s.setSelectionRange(selStart, selStart); } catch(e){} }
    }
  }

  async function toggleVote(voterId) {
    const p = currentNode();
    if (!p || p.type !== 'precinct') return;
    const v = p.voters.find(x => x.id === voterId);
    if (!v) return;
    const desired = !v.voted;
    v.voted = desired;
    v.ts = desired ? Date.now() : null;
    v.by = desired ? me.name : null;
    render();
    if (navigator.vibrate) navigator.vibrate(desired ? 30 : 15);
    try {
      await api('POST', `/api/nodes/${p.id}/voters/${voterId}/vote`, { voted: desired });
    } catch (e) {
      toast('Ошибка: ' + e.message);
      fetchState();
    }
  }

  // ---------- Create / Edit modal ----------
  let editing = null; // { mode: 'create'|'edit', node, type, parentId }

  function openCreateMenu() {
    const cur = currentNode();
    const types = allowedChildTypes(cur);
    if (types.length === 1) return openCreate(types[0], cur ? cur.id : null);
    // Toggle FAB menu
    const f = $('fabCreate');
    if (f.style.display === 'none') {
      // no FAB shown; pick best
      openCreate(types[0] || 'precinct', cur ? cur.id : null);
    } else {
      $('fabMenu').classList.toggle('show');
    }
  }

  async function openCreate(type, parentId) {
    editing = { mode: 'create', type, parentId };
    $('editTitle').textContent = `Создать ${TYPE_LABEL[type]}`;
    $('editName').value = '';
    $('votersRow').style.display = type === 'precinct' ? '' : 'none';
    $('editVoters').value = '';
    if (me.isAdmin) {
      if (!allUsers.length) { try { allUsers = await api('GET','/api/users'); } catch(e){} }
      $('ownerRow').style.display = '';
      $('editOwner').innerHTML = allUsers.map(u =>
        `<option value="${u.id}" ${u.id===me.id?'selected':''}>${escapeHtml(u.name)}${u.isAdmin?' (админ)':''}</option>`
      ).join('');
    } else { $('ownerRow').style.display = 'none'; }
    $('parentRow').style.display = 'none';
    $('editModal').classList.add('show');
  }

  async function openEdit(node) {
    if (!node) return;
    editing = { mode: 'edit', node };
    $('editTitle').textContent = `Редактирование (${TYPE_LABEL[node.type]})`;
    $('editName').value = node.name;
    $('votersRow').style.display = node.type === 'precinct' ? '' : 'none';
    $('editVoters').value = node.type === 'precinct' ? (node.voters || []).map(v => v.name).join('\n') : '';
    if (me.isAdmin) {
      if (!allUsers.length) { try { allUsers = await api('GET','/api/users'); } catch(e){} }
      $('ownerRow').style.display = '';
      $('editOwner').innerHTML = allUsers.map(u =>
        `<option value="${u.id}" ${u.id===node.ownerId?'selected':''}>${escapeHtml(u.name)}${u.isAdmin?' (админ)':''}</option>`
      ).join('');
      // Parent selector: only valid parents for this type
      $('parentRow').style.display = '';
      const opts = ['<option value="">(верхний уровень)</option>'];
      const candidates = validParents(node.type, node.id);
      for (const c of candidates) {
        opts.push(`<option value="${c.id}" ${c.id===node.parentId?'selected':''}>${escapeHtml(c.path.map(p=>p.name).join(' / '))}</option>`);
      }
      $('editParent').innerHTML = opts.join('');
    } else {
      $('ownerRow').style.display = 'none';
      $('parentRow').style.display = 'none';
    }
    $('editModal').classList.add('show');
  }

  function validParents(forType, excludeId) {
    // forType=workshop → parents are factories
    // forType=precinct → parents are workshops or factories
    // forType=factory → no parent
    if (forType === 'factory') return [];
    const allowed = forType === 'workshop' ? ['factory'] : ['workshop','factory'];
    return serverNodes.filter(n =>
      allowed.includes(n.type) &&
      n.id !== excludeId &&
      !isDescendantOf(n, excludeId)
    );
  }
  function isDescendantOf(node, ancestorId) {
    if (!ancestorId) return false;
    let cur = node;
    while (cur && cur.parentId) {
      if (cur.parentId === ancestorId) return true;
      cur = findNode(cur.parentId);
    }
    return false;
  }

  async function saveEdit() {
    if (!editing) return;
    const name = $('editName').value.trim();
    if (!name) { alert('Введите название'); return; }
    try {
      if (editing.mode === 'create') {
        const payload = { type: editing.type, name, parentId: editing.parentId };
        if (me.isAdmin) payload.ownerId = $('editOwner').value;
        if (editing.type === 'precinct') {
          payload.voters = $('editVoters').value.split('\n').map(s => s.trim()).filter(Boolean);
        }
        const created = await api('POST', '/api/nodes', payload);
        $('editModal').classList.remove('show');
        await fetchState();
        // Navigate into created node if it has children-capable type, else stay
        navTo(created.id);
      } else {
        const node = editing.node;
        const payload = { name };
        if (me.isAdmin) {
          payload.ownerId = $('editOwner').value;
          payload.parentId = $('editParent').value || null;
        }
        if (node.type === 'precinct') {
          payload.voters = $('editVoters').value.split('\n').map(s => s.trim()).filter(Boolean);
        }
        await api('PUT', `/api/nodes/${node.id}`, payload);
        $('editModal').classList.remove('show');
        await fetchState();
      }
    } catch (e) { toast('Ошибка: ' + e.message); }
  }

  async function deleteNode(node) {
    if (!node) return;
    const sub = serverNodes.filter(n => n.id === node.id ||
      (n.path && n.path.some(p => p.id === node.id) && n.id !== node.id));
    const cascade = sub.length - 1;
    const msg = cascade > 0
      ? `Удалить «${node.name}» и вложенные узлы (${cascade})? Действие необратимо.`
      : `Удалить «${node.name}»? Действие необратимо.`;
    if (!confirm(msg)) return;
    try {
      await api('DELETE', `/api/nodes/${node.id}`);
      // go to parent
      navTo(node.parentId || null);
      await fetchState();
    } catch (e) { toast('Ошибка: ' + e.message); }
  }

  async function resetSubtree(node) {
    if (!node) return;
    const lbl = node.type === 'precinct' ? 'этом участке' : `всех участках «${node.name}»`;
    if (!confirm(`Сбросить все отметки на ${lbl}?`)) return;
    try { await api('POST', `/api/nodes/${node.id}/reset`); }
    catch (e) { toast('Ошибка: ' + e.message); }
  }

  // ---------- Menu ----------
  function openMenu() {
    const items = [];
    if (me.isAdmin) {
      items.push(`<a class="btn btn-secondary" href="summary.html" style="text-align:center; text-decoration:none; line-height:1.2;">Сводка по всем участкам</a>`);
      items.push(`<a class="btn btn-secondary" href="admin.html" style="text-align:center; text-decoration:none; line-height:1.2;">Управление пользователями</a>`);
    }
    items.push(`<button class="btn btn-secondary" id="actExport">Экспорт результатов (CSV)</button>`);
    items.push(`<button class="btn btn-secondary" id="actLogout">Выйти из аккаунта</button>`);
    items.push(`<button class="btn btn-secondary" id="closeMenu">Закрыть</button>`);
    $('menuItems').innerHTML = items.join('');
    $('menuModal').classList.add('show');
    $('closeMenu').addEventListener('click', () => $('menuModal').classList.remove('show'));
    $('actExport').addEventListener('click', exportCSV);
    $('actLogout').addEventListener('click', logout);
  }
  function logout() {
    if (!confirm('Выйти? Для входа потребуется ссылка от администратора.')) return;
    localStorage.removeItem('vt_token');
    localStorage.removeItem('vt_currentId');
    location.reload();
  }
  function exportCSV() {
    const rows = [['Завод','Цех','Участок','Владелец','ФИО','Проголосовал','Время','Кто отметил']];
    for (const n of serverNodes) {
      if (n.type !== 'precinct') continue;
      const path = n.path || [];
      const fac = path.find(p => p.type === 'factory')?.name || '';
      const wsh = path.find(p => p.type === 'workshop')?.name || '';
      const pre = n.name;
      for (const v of (n.voters || [])) {
        rows.push([fac, wsh, pre, n.ownerName || '',
          v.name, v.voted ? 'Да' : 'Нет',
          v.ts ? new Date(v.ts).toLocaleString('ru-RU') : '',
          v.by || '']);
      }
    }
    const csv = '﻿' + rows.map(r =>
      r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')
    ).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `voting_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    $('menuModal').classList.remove('show');
  }

  // ---------- CSV import in editor ----------
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const sample = text.split('\n').slice(0, 10).join('\n');
    const counts = {
      ';': (sample.match(/;/g) || []).length,
      ',': (sample.match(/,/g) || []).length,
      '\t':(sample.match(/\t/g)|| []).length
    };
    const delim = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0] || ',';
    const rows = [];
    let i = 0, field = '', row = [], inQuotes = false;
    while (i < text.length) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i+1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"' && field === '') { inQuotes = true; i++; continue; }
      if (c === delim) { row.push(field); field = ''; i++; continue; }
      if (c === '\n' || c === '\r') {
        if (field !== '' || row.length) { row.push(field); rows.push(row); row = []; field = ''; }
        if (c === '\r' && text[i+1] === '\n') i += 2; else i++;
        continue;
      }
      field += c; i++;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c));
  }
  function onVotersCsv(e) {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        let rows = parseCSV(String(reader.result || ''));
        if (rows.length > 1) {
          const first = (rows[0][0] || '').toLowerCase();
          if (['фио','имя','name','полное имя','сотрудник'].some(h => first.includes(h))) rows = rows.slice(1);
        }
        const names = rows.map(r => r[0]).filter(Boolean);
        if (!names.length) { toast('В файле не найдено ФИО'); return; }
        const ta = $('editVoters');
        if ($('votersCsvAppend').checked && ta.value.trim()) {
          ta.value = ta.value.replace(/\s+$/,'') + '\n' + names.join('\n');
        } else { ta.value = names.join('\n'); }
        $('votersCsvStatus').textContent = `Загружено: ${names.length}`;
        setTimeout(() => { $('votersCsvStatus').textContent = ''; }, 3000);
      } catch (err) { toast('Ошибка чтения CSV: ' + err.message); }
    };
    reader.readAsText(f, 'utf-8');
  }

  // ---------- Load / SSE ----------
  async function fetchState() {
    try {
      const s = await api('GET', '/api/state');
      serverNodes = s.nodes;
      if (ui.currentId && !findNode(ui.currentId)) {
        ui.currentId = null; localStorage.removeItem('vt_currentId');
      }
      setConn('ok');
      render();
    } catch (e) {
      if (e.message !== 'Не авторизованы') { setConn('bad'); toast('Нет связи с сервером'); }
    }
  }
  function connect() {
    if (es) { try { es.close(); } catch(e){} }
    setConn(null);
    es = new EventSource('/api/events?token=' + encodeURIComponent(tokenStr()));
    es.addEventListener('open', () => setConn('ok'));
    es.addEventListener('error', () => setConn('bad'));
    es.addEventListener('change', () => { fetchState(); allUsers = []; });
  }
  async function init() {
    if (!tokenStr()) { showLogin(); return; }
    try { me = await api('GET', '/api/me'); }
    catch (e) { showLogin(); return; }
    renderHeaderActions();
    await fetchState();
    connect();
  }

  ['editModal','menuModal'].forEach(id => {
    $(id).addEventListener('click', e => { if (e.target.id === id) $(id).classList.remove('show'); });
  });
  $('cancelEdit').addEventListener('click', () => $('editModal').classList.remove('show'));
  $('saveEdit').addEventListener('click', saveEdit);
  $('votersCsvFile').addEventListener('change', onVotersCsv);

  document.addEventListener('click', e => {
    if (!e.target.closest('#fabCreate')) $('fabMenu').classList.remove('show');
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && (!es || es.readyState === 2)) { connect(); fetchState(); }
  });

  init();
})();
</script>
</body>
