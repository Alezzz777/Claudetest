global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:9464']
        labels:
          service: otel-collector

  - job_name: kafka-jmx
    static_configs:
      - targets: ['kafka:9308']
        labels:
          service: kafka
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgres

  - job_name: production-service
    metrics_path: /metrics
    static_configs:
      - targets: ['production-service:3000']
        labels:
          service: production-service

  - job_name: quality-service
    metrics_path: /metrics
    static_configs:
      - targets: ['quality-service:3001']
        labels:
          service: quality-service

  - job_name: maintenance-service
    metrics_path: /metrics
    static_configs:
      - targets: ['maintenance-service:3002']
        labels:
          service: maintenance-service

  - job_name: inventory-service
    metrics_path: /metrics
    static_configs:
      - targets: ['inventory-service:3003']
        labels:
          service: inventory-service

  - job_name: recipe-service
    metrics_path: /metrics
    static_configs:
      - targets: ['recipe-service:3004']
        labels:
          service: recipe-service

  - job_name: scheduling-service
    metrics_path: /metrics
    static_configs:
      - targets: ['scheduling-service:3005']
        labels:
          service: scheduling-service

  - job_name: integration-service
    metrics_path: /metrics
    static_configs:
      - targets: ['integration-service:3006']
        labels:
          service: integration-service

  - job_name: admin-service
    metrics_path: /metrics
    static_configs:
      - targets: ['admin-service:3007']
        labels:
          service: admin-service
