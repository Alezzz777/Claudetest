databases:
  - name: master-uchastka-db
    plan: free
    databaseName: master_uchastka
    user: master_user

services:
  - type: web
    name: master-uchastka
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node db/seed.js; node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: master-uchastka-db
          property: connectionString
