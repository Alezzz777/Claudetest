<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e88e5">
<title>Управление пользователями</title>
<link rel="manifest" href="manifest.json">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#f4f6f8; color:#1f2933;
  }
  body { min-height:100vh; display:flex; flex-direction:column; }

  header {
    position:sticky; top:0; z-index:10;
    background:#1e88e5; color:#fff; padding:12px 14px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  header h1 { margin:0; font-size:17px; font-weight:600; display:flex; align-items:center; gap:8px; }
  header a.btnlink {
    background: rgba(255,255,255,.18); color:#fff; border:none;
    padding:8px 12px; border-radius:8px; font-size:14px;
    text-decoration:none; display:inline-flex; align-items:center;
  }
  header a.btnlink:active { background: rgba(255,255,255,.32); }
  .conn { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ffca28; }
  .conn.ok { background:#66bb6a; } .conn.bad { background:#ef5350; }

  main { flex:1; padding:14px; max-width:800px; width:100%; margin:0 auto; }

  .section { background:#fff; border-radius:12px; padding:14px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .section h2 { margin:0 0 12px; font-size:16px; }

  .user {
    border:1px solid #eef2f5; border-radius:10px;
    padding:12px; margin-bottom:8px; display:flex;
    align-items:center; gap:10px; flex-wrap:wrap;
  }
  .user .info { flex:1; min-width:0; }
  .user .name { font-weight:600; font-size:15px; }
  .user .meta { font-size:12px; color:#607080; margin-top:2px; }
  .badge { background:#ff9800; color:#fff; font-size:10px; padding:2px 6px; border-radius:4px; margin-left:6px; vertical-align:middle; }
  .me-badge { background:#1e88e5; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; }
  .actions button {
    background:#eceff1; color:#37474f; border:none;
    padding:7px 10px; border-radius:6px; font-size:12px; cursor:pointer;
  }
  .actions button.danger { background:#ffebee; color:#c62828; }
  .actions button:active { opacity:.85; }

  .link-box {
    background:#f4f6f8; border-radius:8px; padding:8px 10px;
    font-family: ui-monospace, "SF Mono", Monaco, monospace;
    font-size:12px; word-break:break-all; margin-top:8px;
    display:flex; align-items:center; gap:8px;
  }
  .link-box code { flex:1; }
  .link-box button {
    background:#1e88e5; color:#fff; border:none;
    padding:6px 10px; border-radius:6px; font-size:11px; cursor:pointer; flex-shrink:0;
  }

  .add-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .add-row input[type=text] {
    flex:1; min-width:160px; padding:11px 12px;
    border:1px solid #d0d8e0; border-radius:10px; font-size:15px; outline:none;
  }
  .add-row label { display:flex; align-items:center; gap:6px; font-size:13px; color:#546e7a; }
  .btn {
    padding:11px 16px; border-radius:10px; border:none;
    font-size:14px; font-weight:600; cursor:pointer;
  }
  .btn-primary { background:#1e88e5; color:#fff; }
  .btn:active { opacity:.85; }

  .empty { text-align:center; padding:30px 16px; color:#78909c; }
  .toast {
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:rgba(33,33,33,.92); color:#fff; padding:10px 16px;
    border-radius:24px; font-size:14px; z-index:200;
    opacity:0; transition:opacity .25s; pointer-events:none; max-width:90%;
  }
  .toast.show { opacity:1; }

  .stat-row { display:flex; gap:14px; font-size:13px; color:#546e7a; flex-wrap:wrap; }
  .stat-row b { color:#1f2933; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; align-items: flex-end; justify-content: center; z-index: 100;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #fff; width: 100%; max-width: 700px;
    border-radius: 16px 16px 0 0; padding: 18px;
    max-height: 88vh; overflow-y: auto;
  }
  .modal h2 { margin: 0 0 12px; font-size: 18px; }

  .preview {
    background:#f4f6f8; border-radius:8px; padding:10px;
    max-height:220px; overflow-y:auto; margin:8px 0;
    font-size:13px;
  }
  .preview .pr-row { padding:3px 0; border-bottom:1px solid #e3eaf0; }
  .preview .pr-row:last-child { border-bottom: 0; }
  .preview .pr-row .ad { color:#ff9800; font-size:11px; margin-left:6px; }

  .csv-hint {
    font-size: 12px; color: #607080; background: #f4f6f8;
    border-radius: 8px; padding: 10px 12px; margin: 8px 0;
    line-height: 1.5;
  }
  .csv-hint code { background: #fff; padding: 1px 5px; border-radius: 3px; font-size: 11px; }

  .backup-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  @media (max-width: 540px) { .backup-grid { grid-template-columns: 1fr; } }
  .backup-card {
    border: 1px solid #eef2f5; border-radius: 10px; padding: 12px;
  }
  .backup-card h3 { margin: 0 0 4px; font-size: 14px; }
  .backup-card p { margin: 0 0 10px; font-size: 12px; color: #78909c; }
  .backup-card .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .backup-card .row .btn { flex: 1 1 0; min-width: 110px; padding: 10px; font-size: 13px; font-weight: 600; }
  .mode-list { display:flex; flex-direction:column; gap:8px; margin:8px 0 4px; }
  .mode-list label {
    display:flex; gap:8px; align-items:flex-start;
    padding:10px 12px; border:1px solid #d0d8e0; border-radius:10px; cursor:pointer;
  }
  .mode-list label.sel { border-color:#1e88e5; background:#e3f2fd; }
  .mode-list .t { font-weight:600; font-size:14px; }
  .mode-list .d { font-size:12px; color:#546e7a; margin-top:2px; }
</style>
</head>
<body>

<header>
  <h1><span class="conn" id="conn"></span> Пользователи</h1>
  <div style="display:flex; gap:6px;">
    <a class="btnlink" href="summary.html">📊 Сводка</a>
    <a class="btnlink" href="index.html">← Назад</a>
  </div>
</header>

<main id="main">
  <div class="empty">Загрузка…</div>
</main>

<div class="toast" id="toast"></div>

<!-- CSV import preview modal -->
<div class="modal-bg" id="importModal">
  <div class="modal">
    <h2>Импорт пользователей из CSV</h2>
    <div class="csv-hint">
      Формат: одна строка — один пользователь. Первая колонка — имя,
      вторая (необязательная) — роль: <code>admin</code>/<code>админ</code>/<code>1</code>
      для администратора. Разделитель: <code>,</code> <code>;</code> или табуляция.
      Кавычки поддерживаются.
    </div>
    <div id="importStats" style="font-size:13px; margin-bottom:6px;"></div>
    <div class="preview" id="importPreview"></div>
    <div style="display:flex; gap:8px; margin-top:12px;">
      <button class="btn" style="background:#eceff1; color:#37474f;" id="cancelImport">Отмена</button>
      <button class="btn btn-primary" id="confirmImport">Создать пользователей</button>
    </div>
  </div>
</div>

<!-- Backup import modal -->
<div class="modal-bg" id="backupModal">
  <div class="modal">
    <h2 id="backupTitle"></h2>
    <div id="backupStats" style="font-size:13px; margin-bottom:6px;"></div>
    <div id="backupWarn" style="font-size:12px; color:#c62828; background:#ffebee; border-radius:8px; padding:8px 10px; margin:6px 0; display:none;"></div>

    <label style="margin-top:10px;">Режим импорта:</label>
    <div class="mode-list" id="backupModes">
      <label class="sel" data-mode="merge">
        <input type="radio" name="bmode" value="merge" checked>
        <span>
          <div class="t">Добавить</div>
          <div class="d">Существующие записи сохраняются; добавляются новые из файла.</div>
        </span>
      </label>
      <label data-mode="replace">
        <input type="radio" name="bmode" value="replace">
        <span>
          <div class="t">Заменить</div>
          <div class="d">Все существующие записи удаляются, на их место загружается содержимое файла.</div>
        </span>
      </label>
    </div>

    <div class="modal-actions">
      <button class="btn" style="background:#eceff1; color:#37474f;" id="cancelBackup">Отмена</button>
      <button class="btn btn-primary" id="confirmBackup">Импортировать</button>
    </div>
  </div>
</div>

<!-- Result modal (created users with links) -->
<div class="modal-bg" id="resultModal">
  <div class="modal">
    <h2 id="resultTitle">Пользователи созданы</h2>
    <div id="resultBody"></div>
    <div style="display:flex; gap:8px; margin-top:12px;">
      <button class="btn" style="background:#eceff1; color:#37474f;" id="closeResult">Закрыть</button>
      <button class="btn btn-primary" id="downloadLinks">Скачать ссылки CSV</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  function readUrlToken() {
    const params = new URLSearchParams(location.search);
    const t = params.get('token');
    if (t) {
      localStorage.setItem('vt_token', t);
      params.delete('token');
      const q = params.toString();
      history.replaceState({}, '', location.pathname + (q ? '?' + q : ''));
    }
  }
  readUrlToken();
  const token = () => localStorage.getItem('vt_token') || '';

  let me = null;
  let users = [];
  let es = null;

  function setConn(s) {
    const el = $('conn');
    el.classList.remove('ok','bad');
    if (s === 'ok')  el.classList.add('ok');
    if (s === 'bad') el.classList.add('bad');
  }
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function api(method, path, body) {
    const opts = {
      method,
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token() }
    };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const r = await fetch(path, opts);
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    return data;
  }

  function copy(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => toast('Ссылка скопирована'));
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Ссылка скопирована'); }
      catch (e) { toast('Не удалось скопировать'); }
      document.body.removeChild(ta);
    }
  }

  function render() {
    const m = $('main');
    if (!me) {
      m.innerHTML = '<div class="empty"><p>Не авторизованы. Откройте свою ссылку.</p><p><a href="index.html">← На главную</a></p></div>';
      return;
    }
    if (!me.isAdmin) {
      m.innerHTML = '<div class="empty"><p>Доступ только для администратора.</p><p><a href="index.html">← На главную</a></p></div>';
      return;
    }

    const totalUsers = users.length;
    const admins = users.filter(u => u.isAdmin).length;

    m.innerHTML = `
      <div class="section">
        <h2>Добавить пользователя</h2>
        <div class="add-row">
          <input type="text" id="newName" placeholder="Имя (например: Оператор Иванов)">
          <label><input type="checkbox" id="newAdmin"> администратор</label>
          <button class="btn btn-primary" id="addBtn">Создать</button>
        </div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:12px;">
          <label class="btn" style="background:#e3f2fd; color:#1565c0; flex:0 0 auto; cursor:pointer;">
            📂 Импорт CSV
            <input type="file" id="csvFile" accept=".csv,.txt,text/csv,text/plain" style="display:none;">
          </label>
          <span style="font-size:12px; color:#78909c;">массовое создание из файла</span>
        </div>
        <p style="font-size:12px; color:#78909c; margin:8px 0 0;">
          После создания будет показана ссылка для входа — передайте её пользователю.
        </p>
      </div>

      <div class="section">
        <h2>Пользователи (${totalUsers}, админов: ${admins})</h2>
        <div id="userList"></div>
      </div>

      <div class="section">
        <h2>Резервные копии</h2>
        <div class="backup-grid">
          <div class="backup-card">
            <h3>База пользователей</h3>
            <p>Список аккаунтов с токенами и ролями. Используйте для переноса
               пользователей между серверами или восстановления доступа.</p>
            <div class="row">
              <button class="btn btn-primary" id="exportUsers">⬇ Экспорт JSON</button>
              <label class="btn" style="background:#eceff1; color:#37474f; cursor:pointer;">
                ⬆ Импорт JSON
                <input type="file" id="importUsersFile" accept=".json,application/json" style="display:none;">
              </label>
            </div>
          </div>
          <div class="backup-card">
            <h3>Состояние голосования</h3>
            <p>Все участки, списки ФИО, отметки и журнал «кто отметил».
               Снимок данных для бэкапа или переноса.</p>
            <div class="row">
              <button class="btn btn-primary" id="exportState">⬇ Экспорт JSON</button>
              <label class="btn" style="background:#eceff1; color:#37474f; cursor:pointer;">
                ⬆ Импорт JSON
                <input type="file" id="importStateFile" accept=".json,application/json" style="display:none;">
              </label>
            </div>
          </div>
        </div>
      </div>
    `;
    $('addBtn').addEventListener('click', addUser);
    $('newName').addEventListener('keydown', e => { if (e.key === 'Enter') addUser(); });
    $('csvFile').addEventListener('change', onCsvFile);

    $('exportUsers').addEventListener('click', () => exportBackup('users'));
    $('exportState').addEventListener('click', () => exportBackup('state'));
    $('importUsersFile').addEventListener('change', e => onBackupFile(e, 'users'));
    $('importStateFile').addEventListener('change', e => onBackupFile(e, 'state'));
    renderUsers();
  }

  // ---------- Backup / Restore ----------
  async function exportBackup(kind) {
    try {
      const r = await fetch(`/api/export/${kind}`, { headers: { 'Authorization': 'Bearer ' + token() } });
      if (!r.ok) { toast('Ошибка экспорта: HTTP ' + r.status); return; }
      const data = await r.json();
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const date = new Date().toISOString().slice(0,16).replace(':','-');
      a.download = `voting_${kind}_${date}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast(kind === 'users' ? 'Файл пользователей скачан' : 'Файл состояния скачан');
    } catch (e) { toast('Ошибка: ' + e.message); }
  }

  let pendingBackup = null; // { kind: 'users'|'state', data: {...} }

  function onBackupFile(e, kind) {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try { data = JSON.parse(String(reader.result || '')); }
      catch (err) { toast('Файл не является корректным JSON'); return; }

      const list = kind === 'users'
        ? data.users
        : (Array.isArray(data.nodes) ? data.nodes : data.precincts);
      if (!Array.isArray(list)) {
        toast(`Файл не содержит ${kind === 'users' ? 'списка пользователей' : 'списка узлов/участков'}`);
        return;
      }
      const expectedKind = 'voting-tracker-' + kind;
      if (data.kind && data.kind !== expectedKind) {
        if (!confirm(`Файл помечен как «${data.kind}», ожидался «${expectedKind}». Продолжить?`)) return;
      }
      pendingBackup = { kind, data, list };
      showBackupModal();
    };
    reader.readAsText(f, 'utf-8');
  }

  function showBackupModal() {
    const { kind, list, data } = pendingBackup;
    const isUsers = kind === 'users';
    $('backupTitle').textContent = isUsers
      ? 'Импорт базы пользователей'
      : 'Импорт состояния голосования';

    let stats;
    if (isUsers) {
      const admins = list.filter(u => u.isAdmin).length;
      stats = `В файле: <b>${list.length}</b> пользователей, из них админов: <b>${admins}</b>` +
              (data.exportedAt ? ` · экспорт: ${new Date(data.exportedAt).toLocaleString('ru-RU')}` : '');
    } else {
      const types = {factory:0, workshop:0, precinct:0};
      list.forEach(n => { types[n.type || 'precinct'] = (types[n.type||'precinct']||0) + 1; });
      const voters = list.reduce((s,p) => s + (Array.isArray(p.voters) ? p.voters.length : 0), 0);
      const voted  = list.reduce((s,p) => s + (Array.isArray(p.voters) ? p.voters.filter(v=>v.voted).length : 0), 0);
      stats = `В файле: заводов <b>${types.factory||0}</b>, цехов <b>${types.workshop||0}</b>, участков <b>${types.precinct||0}</b>, сотрудников <b>${voters}</b>, с отметкой <b>${voted}</b>` +
              (data.exportedAt ? ` · экспорт: ${new Date(data.exportedAt).toLocaleString('ru-RU')}` : '');
    }
    $('backupStats').innerHTML = stats;

    $('backupWarn').style.display = 'none';
    updateBackupWarn('merge');

    $('backupModes').querySelectorAll('label').forEach(l => {
      l.classList.toggle('sel', l.dataset.mode === 'merge');
      const input = l.querySelector('input');
      input.checked = (l.dataset.mode === 'merge');
    });
    $('backupModal').classList.add('show');
  }

  function updateBackupWarn(mode) {
    const w = $('backupWarn');
    if (mode !== 'replace') { w.style.display = 'none'; return; }
    const { kind } = pendingBackup;
    w.style.display = 'block';
    w.innerHTML = kind === 'users'
      ? '⚠ Все существующие пользователи (кроме вас) будут удалены. Их ссылки перестанут работать.'
      : '⚠ Все существующие участки и отметки будут удалены и заменены содержимым файла.';
  }

  async function confirmBackupImport() {
    if (!pendingBackup) return;
    const { kind, list } = pendingBackup;
    const mode = document.querySelector('input[name="bmode"]:checked').value;

    if (mode === 'replace' && !confirm('Точно заменить все данные? Действие необратимо.')) return;

    const path = '/api/import/' + kind;
    const body = kind === 'users' ? { users: list, mode } : { nodes: list, mode };
    try {
      const r = await api('POST', path, body);
      $('backupModal').classList.remove('show');
      pendingBackup = null;
      let msg;
      if (kind === 'users') {
        msg = mode === 'replace'
          ? `База пользователей заменена: всего ${r.total}`
          : `Добавлено пользователей: ${r.added}` + (r.kept ? `, пропущено существующих: ${r.kept}` : '');
      } else {
        msg = mode === 'replace'
          ? `Состояние голосования заменено: узлов ${r.total}`
          : `Импортировано узлов: ${r.imported}` +
            (r.ownerReassigned ? `, переназначено владельцев на вас: ${r.ownerReassigned}` : '');
      }
      toast(msg);
      await loadUsers();
    } catch (e) { toast('Ошибка: ' + e.message); }
  }

  // ---------- CSV ----------
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const sample = text.split('\n').slice(0, 10).join('\n');
    const counts = {
      ';': (sample.match(/;/g) || []).length,
      ',': (sample.match(/,/g) || []).length,
      '\t':(sample.match(/\t/g)|| []).length
    };
    const delim = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0] || ',';
    const rows = [];
    let i = 0, field = '', row = [], inQuotes = false;
    while (i < text.length) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i+1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"' && field === '') { inQuotes = true; i++; continue; }
      if (c === delim) { row.push(field); field = ''; i++; continue; }
      if (c === '\n' || c === '\r') {
        if (field !== '' || row.length) { row.push(field); rows.push(row); row = []; field = ''; }
        if (c === '\r' && text[i+1] === '\n') i += 2; else i++;
        continue;
      }
      field += c; i++;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c));
  }

  const ADMIN_FLAGS = new Set(['admin','админ','administrator','администратор','1','true','yes','да','y']);

  function rowsToUsers(rows) {
    // Skip likely header row
    if (rows.length > 1) {
      const first = (rows[0][0] || '').toLowerCase();
      if (['имя','фио','name','user','пользователь','login'].some(h => first.includes(h))) rows = rows.slice(1);
    }
    return rows.map(r => ({
      name: r[0] || '',
      isAdmin: ADMIN_FLAGS.has((r[1] || '').toLowerCase())
    })).filter(u => u.name);
  }

  let pendingImport = [];
  function onCsvFile(e) {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const rows = parseCSV(String(reader.result || ''));
        pendingImport = rowsToUsers(rows);
        showImportPreview();
      } catch (err) { toast('Ошибка чтения CSV: ' + err.message); }
    };
    reader.readAsText(f, 'utf-8');
  }

  function showImportPreview() {
    const existing = new Set(users.map(u => u.name.toLowerCase()));
    const dupCount = pendingImport.filter(u => existing.has(u.name.toLowerCase())).length;
    const newCount = pendingImport.length - dupCount;
    const adminCount = pendingImport.filter(u => u.isAdmin).length;
    $('importStats').innerHTML = `Найдено: <b>${pendingImport.length}</b>${
      dupCount ? ` · уже существуют (будут пропущены): <b>${dupCount}</b>` : ''
    } · к созданию: <b>${newCount}</b>${adminCount ? ` · из них админов: <b>${adminCount}</b>` : ''}`;
    $('importPreview').innerHTML = pendingImport.length
      ? pendingImport.slice(0, 200).map(u => `
        <div class="pr-row">
          ${escapeHtml(u.name)}${u.isAdmin ? '<span class="ad">админ</span>' : ''}
          ${existing.has(u.name.toLowerCase()) ? '<span style="color:#e53935; font-size:11px; margin-left:6px;">уже существует</span>' : ''}
        </div>`).join('') + (pendingImport.length > 200 ? `<div class="pr-row" style="color:#78909c;">… и ещё ${pendingImport.length - 200}</div>` : '')
      : '<div style="color:#78909c;">Не найдено ни одной строки с данными</div>';
    $('confirmImport').disabled = newCount === 0;
    $('confirmImport').style.opacity = newCount === 0 ? .5 : 1;
    $('importModal').classList.add('show');
  }

  async function confirmImport() {
    try {
      const res = await api('POST', '/api/users/bulk', { users: pendingImport });
      $('importModal').classList.remove('show');
      await loadUsers();
      showResult(res.created, res.skipped);
    } catch (e) { toast('Ошибка: ' + e.message); }
  }

  let lastCreated = [];
  function showResult(created, skipped) {
    lastCreated = created || [];
    $('resultTitle').textContent = `Создано пользователей: ${lastCreated.length}` +
      (skipped && skipped.length ? ` (пропущено существующих: ${skipped.length})` : '');
    $('resultBody').innerHTML = lastCreated.length === 0
      ? '<div class="empty">Никто не создан</div>'
      : lastCreated.map(u => `
        <div class="user" data-id="${u.id}">
          <div class="info">
            <div class="name">${escapeHtml(u.name)}${u.isAdmin?'<span class="badge">админ</span>':''}</div>
            <div class="link-box">
              <code>${escapeHtml(u.link)}</code>
              <button data-copy="${u.id}">📋</button>
            </div>
          </div>
        </div>
      `).join('');
    $('resultBody').querySelectorAll('[data-copy]').forEach(b => {
      b.addEventListener('click', () => {
        const u = lastCreated.find(x => x.id === b.dataset.copy);
        if (u) copy(u.link);
      });
    });
    $('resultModal').classList.add('show');
  }

  function downloadLinks() {
    if (!lastCreated.length) return;
    const rows = [['Имя','Роль','Ссылка']];
    lastCreated.forEach(u => rows.push([u.name, u.isAdmin ? 'admin' : '', u.link]));
    const csv = '﻿' + rows.map(r =>
      r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')
    ).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `voting_users_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function renderUsers() {
    const list = $('userList');
    if (users.length === 0) { list.innerHTML = '<div class="empty">Пользователей нет</div>'; return; }
    list.innerHTML = users.map(u => `
      <div class="user" data-id="${u.id}">
        <div class="info">
          <div class="name">
            ${escapeHtml(u.name)}
            ${u.isAdmin ? '<span class="badge">админ</span>' : ''}
            ${u.id === me.id ? '<span class="badge me-badge">вы</span>' : ''}
          </div>
          <div class="meta">Узлов: ${u.ownedCount} · создан ${new Date(u.createdAt).toLocaleDateString('ru-RU')}</div>
          <div class="link-box">
            <code>${escapeHtml(u.link)}</code>
            <button data-copy="${u.id}">📋</button>
          </div>
        </div>
        <div class="actions">
          <button data-rename="${u.id}">Переименовать</button>
          <button data-toggle="${u.id}">${u.isAdmin ? 'Снять права' : 'Сделать админом'}</button>
          <button data-regen="${u.id}">Новая ссылка</button>
          ${u.id === me.id ? '' : `<button class="danger" data-del="${u.id}">Удалить</button>`}
        </div>
      </div>
    `).join('');

    list.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => {
      const u = users.find(x => x.id === b.dataset.copy);
      if (u) copy(u.link);
    }));
    list.querySelectorAll('[data-rename]').forEach(b => b.addEventListener('click', () => renameUser(b.dataset.rename)));
    list.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => toggleAdmin(b.dataset.toggle)));
    list.querySelectorAll('[data-regen]').forEach(b => b.addEventListener('click', () => regenToken(b.dataset.regen)));
    list.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteUser(b.dataset.del)));
  }

  async function addUser() {
    const name = $('newName').value.trim();
    if (!name) { toast('Введите имя'); return; }
    const isAdmin = $('newAdmin').checked;
    try {
      const u = await api('POST', '/api/users', { name, isAdmin });
      $('newName').value = ''; $('newAdmin').checked = false;
      await loadUsers();
      toast('Создан. Скопируйте ссылку и отправьте пользователю.');
      // auto-copy fresh link
      setTimeout(() => copy(u.link), 200);
    } catch (e) { toast('Ошибка: ' + e.message); }
  }

  async function renameUser(id) {
    const u = users.find(x => x.id === id); if (!u) return;
    const name = prompt('Новое имя:', u.name);
    if (!name || name.trim() === u.name) return;
    try { await api('PUT', `/api/users/${id}`, { name: name.trim() }); await loadUsers(); }
    catch (e) { toast('Ошибка: ' + e.message); }
  }

  async function toggleAdmin(id) {
    const u = users.find(x => x.id === id); if (!u) return;
    if (!confirm(u.isAdmin ? `Снять права администратора у "${u.name}"?` : `Сделать "${u.name}" администратором?`)) return;
    try { await api('PUT', `/api/users/${id}`, { isAdmin: !u.isAdmin }); await loadUsers(); }
    catch (e) { toast('Ошибка: ' + e.message); }
  }

  async function regenToken(id) {
    const u = users.find(x => x.id === id); if (!u) return;
    if (!confirm(`Создать новую ссылку для "${u.name}"? Старая перестанет работать.`)) return;
    try {
      const r = await api('POST', `/api/users/${id}/regenerate-token`);
      await loadUsers();
      copy(r.link);
      toast('Новая ссылка скопирована');
    } catch (e) { toast('Ошибка: ' + e.message); }
  }

  async function deleteUser(id) {
    const u = users.find(x => x.id === id); if (!u) return;
    if (!confirm(`Удалить пользователя "${u.name}"? Его участки перейдут к вам.`)) return;
    try { await api('DELETE', `/api/users/${id}`); await loadUsers(); }
    catch (e) { toast('Ошибка: ' + e.message); }
  }

  async function loadUsers() {
    try {
      users = await api('GET', '/api/users');
      renderUsers();
      setConn('ok');
    } catch (e) {
      setConn('bad');
      toast('Ошибка: ' + e.message);
    }
  }

  function connect() {
    if (es) { try { es.close(); } catch(e){} }
    es = new EventSource('/api/events?token=' + encodeURIComponent(token()));
    es.addEventListener('open', () => setConn('ok'));
    es.addEventListener('error', () => setConn('bad'));
    es.addEventListener('change', loadUsers);
  }

  async function init() {
    if (!token()) {
      $('main').innerHTML = '<div class="empty"><p>Откройте свою ссылку для входа.</p><p><a href="index.html">← На главную</a></p></div>';
      return;
    }
    try { me = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token() } }).then(r => r.ok ? r.json() : null); }
    catch (e) { me = null; }
    if (!me) {
      $('main').innerHTML = '<div class="empty"><p>Не авторизованы.</p><p><a href="index.html">← На главную</a></p></div>';
      return;
    }
    render();
    if (me.isAdmin) { await loadUsers(); connect(); }
  }

  // Bind modals once
  $('cancelImport').addEventListener('click', () => $('importModal').classList.remove('show'));
  $('confirmImport').addEventListener('click', confirmImport);
  $('closeResult').addEventListener('click', () => $('resultModal').classList.remove('show'));
  $('downloadLinks').addEventListener('click', downloadLinks);
  $('cancelBackup').addEventListener('click', () => { $('backupModal').classList.remove('show'); pendingBackup = null; });
  $('confirmBackup').addEventListener('click', confirmBackupImport);
  $('backupModes').addEventListener('change', () => {
    const mode = document.querySelector('input[name="bmode"]:checked').value;
    $('backupModes').querySelectorAll('label').forEach(l => l.classList.toggle('sel', l.dataset.mode === mode));
    updateBackupWarn(mode);
  });
  ['importModal','resultModal','backupModal'].forEach(id => {
    $(id).addEventListener('click', e => { if (e.target.id === id) $(id).classList.remove('show'); });
  });

  init();
})();
</script>
</body>
</html>
