apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mes-ingress
  namespace: mes-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: mes.example.com
      http:
        paths:
          - path: /production(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: production-service, port: { number: 3001 } }
          - path: /quality(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: quality-service, port: { number: 3002 } }
          - path: /maintenance(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: maintenance-service, port: { number: 3003 } }
          - path: /inventory(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: inventory-service, port: { number: 3004 } }
          - path: /recipe(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: recipe-service, port: { number: 3005 } }
          - path: /scheduling(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: scheduling-service, port: { number: 3006 } }
          - path: /integration(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: integration-service, port: { number: 3007 } }
          - path: /admin(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: admin-service, port: { number: 3008 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web-app, port: { number: 80 } }
