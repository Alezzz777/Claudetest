databases:
  - name: familytree-db
    plan: free
    databaseName: familytree
    user: familytree

services:
  - type: web
    name: family-tree
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: familytree-db
          property: connectionString
      - key: PYTHON_ENV
        value: production
